# Les tests à chaque envoi et chaque PR. L'orchestration (chargement, banc, file d'attente de la
# carte) tourne contre un faux llama-server : pas besoin de carte graphique.
# Linux et Windows : le faux moteur est lancé par node, sans script shell.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm run check
