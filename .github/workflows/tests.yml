# Les tests à chaque envoi et chaque PR. L'orchestration (chargement, banc, file d'attente de la
# carte) tourne contre un faux llama-server : pas besoin de carte graphique.
# Windows : à ajouter (runs-on: windows-latest) une fois les tests d'orchestration portés
# (le faux moteur est lancé par un script shell).
name: Tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm run check
