<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d10'/%3E%3Cpath d='M9 23V9m0 7h14m0-7v14' stroke='%233ddc97' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="themes.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="brand-bg"/><path d="M9 23V9m0 7h14m0-7v14" class="brand-mark"/></svg>
        <span>harn</span>
      </div>
      <nav class="nav" id="nav" aria-label="Sections">
        <button data-view="home"><svg viewBox="0 0 20 20"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
        <button data-view="models"><svg viewBox="0 0 20 20"><path d="M10 3 17 6.5 10 10 3 6.5zM3 10l7 3.5 7-3.5M3 13.5 10 17l7-3.5"/></svg><span>Modèles</span></button>
        <button data-view="tuning"><svg viewBox="0 0 20 20"><path d="M4 4v12M10 4v12M16 4v12"/><circle cx="4" cy="12" r="1.8"/><circle cx="10" cy="7" r="1.8"/><circle cx="16" cy="13" r="1.8"/></svg><span>Réglages</span></button>
        <button data-view="machine"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M6.5 5V3.5M10 5V3.5M13.5 5V3.5M6.5 16.5V15M10 16.5V15M13.5 16.5V15"/></svg><span>Machine</span></button>
      </nav>
      <div class="side-foot">
        <div id="status" class="status" aria-live="polite"></div>
        <button id="endpoint" class="endpoint" type="button" title="Copier l’adresse de l’API">
          <span class="endpoint-k">API OpenAI</span><span class="endpoint-v"></span>
        </button>
      </div>
    </aside>
    <div class="content">
      <header class="topline">
        <div class="prefs" role="toolbar" aria-label="Préférences d’affichage">
          <button id="pref-theme" type="button" title="Thème" aria-label="Choisir le thème" aria-haspopup="dialog">
            <svg viewBox="0 0 20 20"><path d="M10 2.8a7.2 7.2 0 1 0 0 14.4c1 0 1.5-.8 1.2-1.6-.4-1 .3-2 1.4-2h1.6a3 3 0 0 0 3-3A7.4 7.4 0 0 0 10 2.8z"/><circle cx="6.5" cy="9" r="1" class="fill"/><circle cx="9.5" cy="6.2" r="1" class="fill"/><circle cx="13" cy="7.5" r="1" class="fill"/></svg>
          </button>
          <button id="pref-mode" type="button"></button>
          <span class="sep" aria-hidden="true"></span>
          <button id="pref-smaller" type="button" title="Texte plus petit" aria-label="Texte plus petit"><span class="a small">A</span><span class="pm">−</span></button>
          <button id="pref-scale" type="button" title="Revenir à la taille normale" aria-label="Taille du texte"></button>
          <button id="pref-larger" type="button" title="Texte plus grand" aria-label="Texte plus grand"><span class="a">A</span><span class="pm">+</span></button>
        </div>
      </header>
      <div id="update" class="update-slot" aria-live="polite"></div>
      <main id="app">
        <div class="boot"><div class="spinner"></div></div>
      </main>
    </div>
  </div>
  <div id="theme-pop" class="card theme-pop" role="dialog" aria-label="Apparence" hidden></div>
  <div id="approvals" class="approvals" aria-live="assertive"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
